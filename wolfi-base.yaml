contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
  packages:
    - ca-certificates-bundle
    - wolfi-base

entrypoint:
  command: /bin/sh -l

archs:
  - x86_64

paths:
  - path: /mnt/config
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o644
    recursive: true
  - path: /mnt/config/default.properties
    type: empty-file
    uid: 65532
    gid: 65532
    permissions: 0o644
  - path: /opt/
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /opt/default.properties
    source: /mnt/config/default.properties
    type: symlink
    uid: 65332
    gid: 65332
    permissions: 0o644
